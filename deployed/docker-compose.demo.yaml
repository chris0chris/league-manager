name: ${SERVICE_NAME}
services:
  mysql:
    # Pinned to the MINOR, the patch floats (D1, Phase 0 of the infrastructure
    # db-tier plan): the nightly reset rebuilds this schema from the prod dump,
    # so the server must be on prod's line. Deliberately NOT in the watchtower
    # `db` scope yet - demo is disposable and moves into the `db-nonprod` tier
    # in a later package, which brings its own scope.
    image: mariadb:13.0
    container_name: ${COMPOSE_PROJECT_NAME}.mysql
    restart: unless-stopped
    # Ceiling (was unlimited). Small demo dataset, so 512m matches prod/staging.
    mem_limit: 512m
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - "./mysql-data:/var/lib/mysql"
      - "./mysql-init:/docker-entrypoint-initdb.d:ro"
    env_file: ls.env.demo
    networks:
      - backend
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb -h localhost --skip-ssl -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    labels:
      - traefik.enable=false
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere

  www:
    image: leaguesphere/frontend:demo
    env_file: .env.demo
    container_name: ${COMPOSE_PROJECT_NAME}.www
    # 30s instead of the frontend image's 10s healthcheck (interval only;
    # Docker keeps the image's test): docker exec healthcheck churn is part of
    # what keeps the shared host's load above its core count.
    healthcheck:
      interval: 30s
    volumes:
      - "../container/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro"
      - media:/media:ro
    labels:
      - traefik.enable=true
      # Required since 2026-10-29: servy's Traefik runs with
      # providers.docker.exposedByDefault=false, so a container is only
      # routed when its service opts in. Without this the site answers
      # Traefik's catchall 404 while the container looks healthy.
      # HTTP -> HTTPS redirect
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`demo.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https
      - traefik.http.middlewares.${SERVICE_NAME}-https.redirectscheme.scheme=https

      # HTTPS for lehel.xyz (DNS resolver)
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver

      # HTTPS for leaguesphere.app (HTTP resolver)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls=true
      - traefik.http.routers.${SERVICE_NAME}_prod.rule=Host(`demo.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls.certresolver=letsencrypthttpresolver

      # Local resolution (HTTP)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web

      # Portainer team
      - io.portainer.accesscontrol.teams=leaguesphere

      # Watchtower scope
      - com.centurylinklabs.watchtower.scope=dev
    networks:
      - backend
      - proxy
    depends_on:
      demo-app:
        condition: service_healthy
    restart: unless-stopped

  demo-app:
    image: leaguesphere/backend:demo
    container_name: ${COMPOSE_PROJECT_NAME}.demo-app
    # 1 worker, not 6: the demo site is a static showcase with ~no traffic and was
    # measured burning 50 % of a host core and 579 MiB (no limit) on 2026-10-29.
    # Production keeps `-w 6`; 1 worker x 2 threads is plenty for a demo.
    command: gunicorn -b 0.0.0.0:8000 -w 1 --worker-class gthread --threads 2 league_manager.wsgi
    # Ceiling so a leak fails inside this container instead of pushing prod's
    # hot pages to swap.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -A healthcheck -H \"Accept: application/json\" http://localhost:8000/health/?format=json"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - traefik.enable=false
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere
      # Watchtower scope
      - com.centurylinklabs.watchtower.scope=dev
      # Ofelia demo reset
      - ofelia.enabled=true
      - ofelia.job-exec.demo-reset.schedule=0 0 0 * * *
      - ofelia.job-exec.demo-reset.command=/bin/bash -c "rm -f /app/.demo_last_reset && /app/entrypoint.demo.sh"
      - ofelia.job-exec.demo-reset.no-overlap=true
    env_file: ls.env.demo
    environment:
      DJANGO_SETTINGS_MODULE: league_manager.settings.demo
      RUN_MIGRATIONS: true
    networks:
      - backend
      - egress
    volumes:
      - media:/app/league_manager/media
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    internal: true
  egress:
    internal: false
  proxy:
    external: true

volumes:
  media:
