[build-system]
# setuptools >= 77 is required for PEP 639 SPDX licence expressions
# (`license = "AGPL-3.0-or-later"` + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leaguesphere"
version = "5.2.1"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.8",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.3",
    "numpy==2.5.4",
    "pandas==3.0.5",
    "django-pandas==0.6.7",
    "djangorestframework==3.18.0",
    "django-autocomplete-light==5.0.0",
    "django-formtools==2.7",
    "Markdown==3.10.3",
    "django-cors-headers==4.9.0",
    "Pillow==13.0.0",
    "django-rest-knox==5.1.0",
    "python-dotenv==1.2.3",
    "mysqlclient==2.2.8",
    "requests==2.34.2",
    "openpyxl==3.1.5",
    # Temporary DB access: Fernet for the one-time credential reveal.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
    "django-webtest==1.9.14",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "django-debug-toolbar==7.1.1",
    "WebTest==3.0.7",
    "pytest-playwright>=0.7.2",
    "bump2version==1.0.1",
    "black==26.10.1",
    "types-factory_boy==0.4.1",
]
prod = [
    "gunicorn>=22.0.0",
]

[tool.setuptools.packages.find]
include = [
    "accounts*",
    "gameevents*",
    "gamedays*",
    "league_manager*",
    "league_table*",
    "liveticker*",
    "locust_testing*",
    "officials*",
    "passcheck*",
    "scorecard*",
    "scorecard_v2*",
    "teammanager*",
    "fe_template*"
]

[tool.bumpversion]
current_version = "4.36.3-rc.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\-rc\\.(?P<rc_build>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-rc.{rc_build}",
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = ["uv lock", "git add uv.lock"]


[tool.bumpversion.parts.release]
optional_value = "stable"
first_value = "rc"
values = ["rc", "stable"]

[tool.bumpversion.parts.rc_build]
first_value = "1"

[[tool.bumpversion.files]]
filename = "league_manager/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "liveticker/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "passcheck/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "scorecard/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "gameday_designer/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
