{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">AFVD Flag Academy Login</legend>
            <p>Bitte melde dich über den AFVD Flag Academy Logindaten von der <a href="https://offd.de/" target="_blank">offd.de</a>-Seite an:</p>
            {{ form | crispy }}
        </fieldset>
        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">
                Anmelden
            </button>
        </div>
    </form>
</div>
{% endblock content %}
